preset:
  name: band
  description: "Band platform REST API and Phoenix Channels WebSocket access"

network_policies:
  band:
    name: band
    endpoints:
      - host: app.band.ai
        port: 443
        access: full
        tls: skip
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
