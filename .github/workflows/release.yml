name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recover-package:
        description: Run automatic Release Please, or recover one package from its exact tagged release commit
        required: true
        type: choice
        # automatic, then each `key` in scripts/release-packages.mjs.
        options: [automatic, sdk, openclaw]
        default: automatic
      release-commit:
        description: Exact 40-character commit SHA to recover (required when recovery is enabled)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # The package a manual dispatch recovers; empty for an automatic release.
      RECOVERY_PACKAGE: ${{ inputs['recover-package'] != 'automatic' && inputs['recover-package'] || '' }}
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      packages: ${{ steps.release_state.outputs.packages }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4; immutable pin protects the privileged release workflow
        with:
          fetch-depth: 0

      - name: Checkout recovery source
        if: env.RECOVERY_PACKAGE != ''
        env:
          RELEASE_COMMIT: ${{ inputs['release-commit'] }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release-commit must be an exact lowercase 40-character commit SHA" >&2
            exit 1
          fi
          git fetch origin main --tags
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "release-commit must be reachable from origin/main" >&2
            exit 1
          fi
          git checkout --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Generate GitHub App Token
        id: app_token_generator
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3; immutable pin protects release credentials
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Determine release mode
        id: release_mode
        shell: bash
        run: |
          if [ -f .release-hold ]; then
            echo "skip_github_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_github_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release baseline
        # The script only validates a baseline; this step decides which one is
        # authoritative so a manual dispatch can't silently inherit a weaker
        # check than a push. A push always has a real github.event.before. A
        # manual `automatic` dispatch has none, so it deliberately checks only
        # the parent of the commit it runs against (see Known gaps).
        id: release_baseline
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "commit=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "commit=HEAD^" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release intent
        env:
          RELEASE_BASE_COMMIT: ${{ steps.release_baseline.outputs.commit }}
          REQUIRE_RELEASE_TAG: ${{ env.RECOVERY_PACKAGE != '' }}
        run: node scripts/assert-release-intent.mjs

      - name: Release Please
        if: env.RECOVERY_PACKAGE == ''
        # Commit-pinned so a mutable release tag can't silently change the
        # workflow that publishes to npm; Dependabot updates this SHA with each
        # release. The release state below reads its per-package outputs, keyed
        # by package path (`packages/sdk--release_created`).
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0; immutable pin protects tag and release creation
        id: release
        with:
          token: ${{ steps.app_token_generator.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-release: ${{ steps.release_mode.outputs.skip_github_release }}

      - name: Resolve release state
        id: release_state
        env:
          RELEASE_PLEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: node scripts/resolve-release-state.mjs

      - name: Record release source
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        if: steps.release_state.outputs.packages != '[]'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4; immutable pin protects the publish toolchain

      - name: Setup Node
        if: steps.release_state.outputs.packages != '[]'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4; immutable pin protects package construction
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.release_state.outputs.packages != '[]'
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        if: steps.release_state.outputs.packages != '[]'
        run: pnpm build

      - name: Copy README into SDK package
        if: contains(fromJSON(steps.release_state.outputs.packages).*.key, 'sdk')
        run: cp README.md packages/sdk/README.md

      - name: Pack released packages (@band-ai)
        if: steps.release_state.outputs.packages != '[]'
        env:
          SELECTED_PACKAGES: ${{ steps.release_state.outputs.packages }}
        run: |
          node scripts/assert-release-ready.mjs
          node scripts/pack-release.mjs release-artifacts

      - name: Upload release bundle
        if: steps.release_state.outputs.packages != '[]'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4; immutable pin protects the handoff to the OIDC job
        with:
          name: release-bundle-${{ steps.source.outputs.commit }}
          path: |
            release-artifacts/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish ${{ matrix.package.name }}
    needs: release
    if: needs.release.outputs.packages != '[]'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      # One package at a time in list order; a failure cancels the rest.
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.release.outputs.packages) }}

    steps:
      - name: Checkout verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4; immutable pin protects the minimal publish job
        with:
          ref: ${{ needs.release.outputs.source_commit }}
          fetch-depth: 1

      - name: Setup Node for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4; immutable pin configures npm authentication
        with:
          # This exact Node release bundles npm 11.16.0, which supports OIDC
          # trusted publishing without installing executable code in this job.
          node-version: 24.18.1
          registry-url: 'https://registry.npmjs.org'

      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4; immutable pin protects the artifact handoff
        with:
          name: release-bundle-${{ needs.release.outputs.source_commit }}
          path: release-artifacts

      - name: Publish to npm (@band-ai)
        env:
          PUBLISH_PACKAGE_NAME: ${{ matrix.package.name }}
          PUBLISH_PACKAGE_VERSION: ${{ matrix.package.version }}
          PUBLISH_TARBALL: release-artifacts/${{ matrix.package.tarball }}
          RELEASE_HOLD_REF: refs/remotes/origin/main
        run: |
          git fetch origin main:refs/remotes/origin/main
          node scripts/assert-release-ready.mjs
          node scripts/publish-if-needed.mjs
          echo "- **${PUBLISH_PACKAGE_NAME}** v${PUBLISH_PACKAGE_VERSION}" >> "$GITHUB_STEP_SUMMARY"
