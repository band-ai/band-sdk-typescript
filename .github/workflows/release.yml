name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    concurrency: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; immutable pin protects the privileged release workflow
        with:
          fetch-depth: 0

      - name: Generate GitHub App Token
        id: app_token_generator
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3; immutable pin protects release credentials
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Determine release mode
        id: release_mode
        shell: bash
        run: |
          if [ -f .release-hold ]; then
            echo "skip_github_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_github_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release Please
        # Commit-pinned so a mutable release tag can't silently change the
        # workflow that publishes to npm; Dependabot updates this SHA with each
        # v4 release. Staying on v4 is deliberate — the per-package output names
        # this job reads (`packages/sdk--release_created`) are v4's.
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4; immutable pin protects tag and release creation
        id: release
        with:
          token: ${{ steps.app_token_generator.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-release: ${{ steps.release_mode.outputs.skip_github_release }}

      # Note: releases_created (plural) is broken in release-please v4 —
      # it returns true even when no release occurred.  Gate on individual
      # package outputs instead.
      - name: Verify coordinated release outputs
        env:
          SDK_RELEASE_CREATED: ${{ steps.release.outputs['packages/sdk--release_created'] }}
          SDK_RELEASE_VERSION: ${{ steps.release.outputs['packages/sdk--version'] }}
          OPENCLAW_RELEASE_CREATED: ${{ steps.release.outputs['packages/openclaw--release_created'] }}
          OPENCLAW_RELEASE_VERSION: ${{ steps.release.outputs['packages/openclaw--version'] }}
        run: node scripts/assert-coordinated-release.mjs

      - name: Install pnpm
        if: steps.release.outputs['packages/sdk--release_created'] == 'true' || steps.release.outputs['packages/openclaw--release_created'] == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; immutable pin protects the publish toolchain

      - name: Setup Node
        if: steps.release.outputs['packages/sdk--release_created'] == 'true' || steps.release.outputs['packages/openclaw--release_created'] == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; immutable pin protects npm authentication and publishing
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing requires npm >= 11.5.1; Node 22 ships npm 10.x.
      - name: Upgrade npm for OIDC trusted publishing
        if: steps.release.outputs['packages/sdk--release_created'] == 'true' || steps.release.outputs['packages/openclaw--release_created'] == 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.release.outputs['packages/sdk--release_created'] == 'true' || steps.release.outputs['packages/openclaw--release_created'] == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        if: steps.release.outputs['packages/sdk--release_created'] == 'true' || steps.release.outputs['packages/openclaw--release_created'] == 'true'
        run: pnpm build

      - name: Copy README into SDK package
        if: steps.release.outputs['packages/sdk--release_created'] == 'true'
        run: cp README.md packages/sdk/README.md

      - name: Publish SDK to npm (@band-ai)
        if: steps.release.outputs['packages/sdk--release_created'] == 'true'
        run: |
          node scripts/assert-release-ready.mjs
          cd packages/sdk
          sed -i 's/"@thenvoi\/sdk"/"@band-ai\/sdk"/' package.json
          npm publish --provenance --access public

      - name: Publish OpenClaw to npm (@band-ai)
        if: steps.release.outputs['packages/openclaw--release_created'] == 'true'
        run: |
          node scripts/assert-release-ready.mjs
          cd packages/openclaw
          # name is already @band-ai/openclaw-channel-band and the SDK is bundled
          # (types inlined), so the package is self-contained — nothing to rewrite.
          npm publish --provenance --access public

      - name: Publish release summary
        if: steps.release.outputs['packages/sdk--release_created'] == 'true' || steps.release.outputs['packages/openclaw--release_created'] == 'true'
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Packages released:" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.release.outputs['packages/sdk--release_created'] }}" == "true" ]; then
            echo "- **@band-ai/sdk** v${{ steps.release.outputs['packages/sdk--version'] }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.release.outputs['packages/openclaw--release_created'] }}" == "true" ]; then
            echo "- **@band-ai/openclaw-channel-band** v${{ steps.release.outputs['packages/openclaw--version'] }}" >> $GITHUB_STEP_SUMMARY
          fi
