name: CI

# GitHub Flow: `main` is the canonical trunk. Keep validating legacy `dev` PRs
# during the transition so old or mistakenly targeted work is not left untested.
on:
  pull_request:
    branches: [main, dev]

# Checkout reads repository contents; paths-filter reads the PR file list.
# No CI job needs write access to repository or pull-request state.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Detect which packages changed to skip unnecessary builds
  changes:
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
      openclaw: ${{ steps.filter.outputs.openclaw }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sdk:
              - 'packages/sdk/**'
              - '.github/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'release-please-config.json'
              - '.release-please-manifest.json'
              - '.release-hold'
            openclaw:
              - 'packages/openclaw/**'
              - 'packages/sdk/**'
              - '.github/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'release-please-config.json'
              - '.release-please-manifest.json'
              - '.release-hold'

  lint:
    needs: changes
    if: needs.changes.outputs.sdk == 'true' || needs.changes.outputs.openclaw == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        if: needs.changes.outputs.sdk == 'true' || needs.changes.outputs.openclaw == 'true'
        run: pnpm --fail-if-no-match --filter @thenvoi/sdk build

      - name: Build OpenClaw
        if: needs.changes.outputs.openclaw == 'true'
        run: pnpm --fail-if-no-match --filter @band-ai/openclaw-channel-band build

      - name: Typecheck SDK
        if: needs.changes.outputs.sdk == 'true'
        run: pnpm --fail-if-no-match --filter @thenvoi/sdk typecheck

      - name: Typecheck OpenClaw
        if: needs.changes.outputs.openclaw == 'true'
        run: pnpm --fail-if-no-match --filter @band-ai/openclaw-channel-band typecheck

      - name: Lint SDK
        if: needs.changes.outputs.sdk == 'true'
        run: pnpm --fail-if-no-match --filter @thenvoi/sdk lint

      - name: Lint OpenClaw
        if: needs.changes.outputs.openclaw == 'true'
        run: pnpm --fail-if-no-match --filter @band-ai/openclaw-channel-band lint

  test:
    needs: changes
    if: needs.changes.outputs.sdk == 'true' || needs.changes.outputs.openclaw == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release intent
        run: node scripts/assert-release-intent.mjs
        env:
          RELEASE_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}

      - name: Build SDK
        if: needs.changes.outputs.sdk == 'true' || needs.changes.outputs.openclaw == 'true'
        run: pnpm --fail-if-no-match --filter @thenvoi/sdk build

      - name: Build OpenClaw
        if: needs.changes.outputs.openclaw == 'true'
        run: pnpm --fail-if-no-match --filter @band-ai/openclaw-channel-band build

      - name: Test SDK
        if: needs.changes.outputs.sdk == 'true'
        run: pnpm --fail-if-no-match --filter @thenvoi/sdk test

      - name: Test OpenClaw
        if: needs.changes.outputs.openclaw == 'true'
        run: pnpm --fail-if-no-match --filter @band-ai/openclaw-channel-band test

      - name: Test release hardening
        run: pnpm test:release-hardening

  packaging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Verify SDK ESM imports
        working-directory: packages/sdk
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'fs';
          import { resolve } from 'path';
          import { pathToFileURL } from 'url';
          const pkg = JSON.parse(readFileSync('./package.json', 'utf8'));
          for (const [entry, paths] of Object.entries(pkg.exports)) {
            const esmPath = paths.import;
            const abs = pathToFileURL(resolve(esmPath));
            const mod = await import(abs);
            const keys = Object.keys(mod);
            if (keys.length === 0) throw new Error('No exports found in ' + esmPath);
            console.log('ESM ' + entry + ': ' + keys.length + ' exports (' + keys.join(', ') + ')');
          }
          "

      - name: Verify SDK CJS imports
        working-directory: packages/sdk
        run: |
          node -e "
          const { readFileSync } = require('fs');
          const { resolve } = require('path');
          const pkg = JSON.parse(readFileSync('./package.json', 'utf8'));
          for (const [entry, paths] of Object.entries(pkg.exports)) {
            const cjsPath = paths.require;
            const mod = require(resolve(cjsPath));
            const keys = Object.keys(mod);
            if (keys.length === 0) throw new Error('No exports found in ' + cjsPath);
            console.log('CJS ' + entry + ': ' + keys.length + ' exports (' + keys.join(', ') + ')');
          }
          "

      - name: Verify OpenClaw build artifacts
        working-directory: packages/openclaw
        run: |
          node -e "
          const fs = require('fs');
          // Verify dist files exist
          const required = ['dist/index.js', 'dist/index.d.ts', 'dist/openclaw.plugin.json'];
          for (const f of required) {
            if (!fs.existsSync(f)) throw new Error('Missing: ' + f);
            const stat = fs.statSync(f);
            if (stat.size === 0) throw new Error('Empty file: ' + f);
            console.log(f + ': ' + (stat.size / 1024).toFixed(1) + ' KB');
          }
          // Verify .d.ts has expected exports
          const dts = fs.readFileSync('dist/index.d.ts', 'utf8');
          const expectedExports = ['createBandChannelPlugin', 'BAND_CHANNEL_ID', 'bandTools', 'BASE_INSTRUCTIONS', 'buildSystemPrompt'];
          for (const exp of expectedExports) {
            if (!dts.includes(exp)) throw new Error('Missing export in .d.ts: ' + exp);
          }
          console.log('OpenClaw: ' + expectedExports.length + ' key exports verified in .d.ts');
          "

  # The single status branch protection should require.
  #
  # `lint` and `test` are intentionally conditional and may report as skipped.
  # `changes` and `packaging` are mandatory and must report success. This job
  # always runs, provides one stable ruleset context, and rejects any other state.
  #
  # Requiring only this context also means adding or renaming a job above never
  # requires editing the ruleset.
  ci-status:
    needs: [changes, lint, test, packaging]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every CI job passed or was skipped
        run: |
          set -euo pipefail
          failed=0
          # `changes` is listed too: when it fails, lint and test are skipped
          # rather than failed, and treating that as a pass would hide the break.
          for entry in \
            "changes:${{ needs.changes.result }}:success" \
            "lint:${{ needs.lint.result }}:success|skipped" \
            "test:${{ needs.test.result }}:success|skipped" \
            "packaging:${{ needs.packaging.result }}:success"; do
            job="${entry%%:*}"
            remainder="${entry#*:}"
            result="${remainder%%:*}"
            allowed="${remainder#*:}"
            case "|$allowed|" in
              *"|$result|"*) printf 'ok      %-10s %s\n' "$job" "$result" ;;
              *) printf 'FAILED  %-10s %s (expected %s)\n' "$job" "$result" "$allowed"; failed=1 ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::one or more CI jobs did not pass"
            exit 1
          fi
          echo "All CI jobs passed or were skipped."
