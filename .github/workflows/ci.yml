name: CI

# GitHub Flow: `main` is the canonical trunk. Keep validating legacy `dev` PRs
# during the transition so old or mistakenly targeted work is not left untested.
#
# `push: [main]` re-validates the trunk after every merge. Without it the suite
# only ever ran against a PR's merge commit, so a red build that landed anyway
# stopped being reported the moment it was merged — which is how a failing
# assertion sat on `main` unnoticed.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

# Checkout reads repository contents; paths-filter reads the PR file list.
# No CI job needs write access to repository or pull-request state.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a PR run is free; superseding a trunk run is not. Cancelling a
  # push run would leave that commit of `main` with no verdict at all, which is
  # the exact gap this workflow's push trigger exists to close.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # Detect which packages changed to skip unnecessary builds.
  #
  # On a push to `main` both outputs are forced true: trunk validation must
  # exercise the whole tree, not the slice one merge happened to touch, or a
  # green `ci-status` would again say nothing about `main`'s actual state.
  changes:
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.sdk }}
      openclaw: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.openclaw }}
      claude-code: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.claude-code }}
      # Any package selected: gates the jobs and steps every package shares.
      any: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.changes != '[]' }}
    steps:
      # Only feeds paths-filter below, which itself only runs on pull_request —
      # skip the checkout too on push so a trunk run doesn't pay for a step with
      # nothing downstream to use it.
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # `shared` lists the control paths that select every package.
          filters: |
            shared: &shared
              - '.github/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'release-please-config.json'
              - '.release-please-manifest.json'
              - '.release-hold'
            sdk:
              - 'packages/sdk/**'
              # The C5 drift proofs assert against these committed fixtures, so
              # a PR that only edits one still has to run the SDK suite.
              - 'docs/migrations/**'
              - *shared
            openclaw:
              - 'plugins/openclaw/**'
              - 'packages/sdk/**'
              - *shared
            claude-code:
              - 'plugins/claude-code/**'
              - 'packages/sdk/**'
              - *shared

  lint:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        if: needs.changes.outputs.any == 'true'
        run: pnpm --fail-if-no-match --filter @band-ai/sdk build

      - name: Build OpenClaw
        if: needs.changes.outputs.openclaw == 'true'
        run: pnpm --fail-if-no-match --filter @band-ai/openclaw-channel-band build

      - name: Typecheck SDK
        if: needs.changes.outputs.sdk == 'true'
        run: pnpm --fail-if-no-match --filter @band-ai/sdk typecheck

      - name: Typecheck OpenClaw
        if: needs.changes.outputs.openclaw == 'true'
        run: pnpm --fail-if-no-match --filter @band-ai/openclaw-channel-band typecheck

      - name: Lint SDK
        if: needs.changes.outputs.sdk == 'true'
        run: pnpm --fail-if-no-match --filter @band-ai/sdk lint

      - name: Lint OpenClaw
        if: needs.changes.outputs.openclaw == 'true'
        run: pnpm --fail-if-no-match --filter @band-ai/openclaw-channel-band lint

      - name: Typecheck Claude Code plugin
        if: needs.changes.outputs.claude-code == 'true'
        run: pnpm --fail-if-no-match --filter @band-ai/claude-code-plugin typecheck

      - name: Lint Claude Code plugin
        if: needs.changes.outputs.claude-code == 'true'
        run: pnpm --fail-if-no-match --filter @band-ai/claude-code-plugin lint

  test:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A merge gate, so it only has a baseline (and only has a job to do) on a
      # pull request. On a push the merge has already happened and release.yml
      # owns the release path; there is no `pull_request.base.sha` to compare
      # against, and inventing one would turn every trunk run red.
      - name: Verify release intent
        if: github.event_name == 'pull_request'
        run: node scripts/assert-release-intent.mjs
        env:
          RELEASE_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}

      - name: Build SDK
        if: needs.changes.outputs.any == 'true'
        run: pnpm --fail-if-no-match --filter @band-ai/sdk build

      - name: Build OpenClaw
        if: needs.changes.outputs.openclaw == 'true'
        run: pnpm --fail-if-no-match --filter @band-ai/openclaw-channel-band build

      - name: Test SDK
        if: needs.changes.outputs.sdk == 'true'
        run: pnpm --fail-if-no-match --filter @band-ai/sdk test

      # Reads the dist/ that "Build SDK" above produced. No secrets or network,
      # so it belongs on every PR, unlike the live harnesses in e2e.yml.
      - name: Bundler interop check (SDK)
        if: needs.changes.outputs.sdk == 'true'
        working-directory: packages/sdk
        run: npx tsx tests/integration/band-sdk-core-bundler.ts

      - name: Test OpenClaw
        if: needs.changes.outputs.openclaw == 'true'
        run: pnpm --fail-if-no-match --filter @band-ai/openclaw-channel-band test

      - name: Test Claude Code plugin
        if: needs.changes.outputs.claude-code == 'true'
        run: pnpm --fail-if-no-match --filter @band-ai/claude-code-plugin test

      - name: Test release hardening
        run: pnpm test:release-hardening

      - name: Test TypeScript core coverage workflow
        run: pnpm test:typescript-core-coverage-workflow

      - name: Test baseline scorecard comment
        run: pnpm test:baseline-scorecard-comment

  packaging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Verify isolated shipped Claude Code plugin
        run: pnpm --filter @band-ai/sdk exec tsx ../../plugins/claude-code/tests/integration/plugin-bundle.ts

      - name: Verify SDK ESM imports
        working-directory: packages/sdk
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'fs';
          import { resolve } from 'path';
          import { pathToFileURL } from 'url';
          const pkg = JSON.parse(readFileSync('./package.json', 'utf8'));
          for (const [entry, paths] of Object.entries(pkg.exports)) {
            const esmPath = paths.import;
            const abs = pathToFileURL(resolve(esmPath));
            const mod = await import(abs);
            const keys = Object.keys(mod);
            if (keys.length === 0) throw new Error('No exports found in ' + esmPath);
            console.log('ESM ' + entry + ': ' + keys.length + ' exports (' + keys.join(', ') + ')');
          }
          "

      - name: Verify SDK CJS imports
        working-directory: packages/sdk
        run: |
          node -e "
          const { readFileSync } = require('fs');
          const { resolve } = require('path');
          const pkg = JSON.parse(readFileSync('./package.json', 'utf8'));
          for (const [entry, paths] of Object.entries(pkg.exports)) {
            const cjsPath = paths.require;
            const mod = require(resolve(cjsPath));
            const keys = Object.keys(mod);
            if (keys.length === 0) throw new Error('No exports found in ' + cjsPath);
            console.log('CJS ' + entry + ': ' + keys.length + ' exports (' + keys.join(', ') + ')');
          }
          "

      # The release workflow copies it in before packing, and the SDK packlist requires it.
      - name: Copy README into SDK package
        run: cp README.md packages/sdk/README.md

      - name: Verify release packlists
        run: |
          node --input-type=module -e "
          import { RELEASE_PACKAGES } from './scripts/release-packages.mjs';
          import { assertPackageContents } from './scripts/assert-package-contents.mjs';
          for (const pkg of RELEASE_PACKAGES) assertPackageContents(pkg.path, pkg.contents);
          "

      - name: Verify OpenClaw build artifacts
        working-directory: plugins/openclaw
        run: |
          node -e "
          const fs = require('fs');
          // The packlist check covers what ships; these are OpenClaw's own extra guarantees.
          if (!fs.existsSync('dist/openclaw.plugin.json')) throw new Error('Missing: dist/openclaw.plugin.json');
          for (const name of fs.readdirSync('dist')) {
            const stat = fs.statSync('dist/' + name);
            if (stat.isFile() && stat.size === 0) throw new Error('Empty file: dist/' + name);
          }
          // Verify .d.ts has expected exports
          const dts = fs.readFileSync('dist/index.d.ts', 'utf8');
          const expectedExports = ['createBandChannelPlugin', 'BAND_CHANNEL_ID', 'bandTools', 'BASE_INSTRUCTIONS', 'buildSystemPrompt'];
          for (const exp of expectedExports) {
            if (!dts.includes(exp)) throw new Error('Missing export in .d.ts: ' + exp);
          }
          console.log('OpenClaw: ' + expectedExports.length + ' key exports verified in .d.ts');
          "

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.289

      - name: Validate the Claude Code plugin
        run: claude plugin validate --strict plugins/claude-code

  # The single status branch protection should require.
  #
  # `lint` and `test` are intentionally conditional and may report as skipped.
  # `changes` and `packaging` are mandatory and must report success. This job
  # always runs, provides one stable ruleset context, and rejects any other state.
  #
  # Requiring only this context also means adding or renaming a job above never
  # requires editing the ruleset.
  ci-status:
    needs: [changes, lint, test, packaging]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every CI job passed or was skipped
        run: |
          set -euo pipefail
          failed=0
          # `changes` is listed too: when it fails, lint and test are skipped
          # rather than failed, and treating that as a pass would hide the break.
          for entry in \
            "changes:${{ needs.changes.result }}:success" \
            "lint:${{ needs.lint.result }}:success|skipped" \
            "test:${{ needs.test.result }}:success|skipped" \
            "packaging:${{ needs.packaging.result }}:success"; do
            job="${entry%%:*}"
            remainder="${entry#*:}"
            result="${remainder%%:*}"
            allowed="${remainder#*:}"
            case "|$allowed|" in
              *"|$result|"*) printf 'ok      %-10s %s\n' "$job" "$result" ;;
              *) printf 'FAILED  %-10s %s (expected %s)\n' "$job" "$result" "$allowed"; failed=1 ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::one or more CI jobs did not pass"
            exit 1
          fi
          echo "All CI jobs passed or were skipped."
