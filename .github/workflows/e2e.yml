name: E2E (live)

# Live E2E against the real Band platform: the baseline suite in
# packages/sdk/tests/baseline. Provisions real agents, hits live REST/WS —
# nightly/on-demand only, never per-PR. What runs is derived from the adapter
# registry and the scenario files, never hand-listed here.

on:
  schedule:
    # Off-peak minute avoids GitHub's top-of-hour thundering herd.
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      filter:
        description: "vitest arguments scoping the baseline run, e.g. `-t anthropic` or `tests/baseline/scenarios/adapters` (blank = full suite)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # The live baseline (tests/baseline): every scenario fanned out across the
  # adapter registry in one job; vitest isolates the files. A scheduled run is
  # the full suite and the canonical scorecard; a manual run may be scoped by
  # `filter`. The `report` job below tells people the outcome.
  baseline:
    name: baseline (live)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # Never cancel in progress: a killed run skips its teardown, orphaning
      # the agents and rooms it provisioned on the real platform.
      group: e2e-baseline-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      BAND_E2E_SCORECARD_JSON: ${{ github.workspace }}/scorecard/scorecard.json
      SCORECARD_MD: ${{ github.workspace }}/scorecard/scorecard.md
      FILTER: ${{ inputs.filter }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Started first so it boots while the job installs everything else.
      - name: Start the Letta server
        env:
          ANTHROPIC_API_KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY }}
        run: .github/scripts/setup-letta.sh start

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every adapter's CLI, unconditionally: the registry decides what runs.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install adapter CLIs
        run: npm install --global @oh-my-pi/pi-coding-agent opencode-ai @github/copilot

      # Cursor ships its CLI (`agent`) as an installer script, not an npm package.
      - name: Install the Cursor agent CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          # The Parlant pin lives in the script, so the script is the cache key.
          cache-dependency-path: .github/scripts/setup-parlant.sh

      - name: Start the Parlant server
        env:
          OPENAI_API_KEY: ${{ secrets.E2E_OPENAI_API_KEY }}
        run: .github/scripts/setup-parlant.sh start

      - name: Wait for the Letta server
        run: .github/scripts/setup-letta.sh wait

      # BAND_API_KEY_USER is the same Band user credential band-sdk-python's
      # e2e.yml uses (its E2E_BAND_API_KEY_USER secret) to provision and reap
      # its own test agents, so the value is shared across both repos.
      - name: Run the live baseline
        working-directory: packages/sdk
        env:
          BAND_API_KEY_USER: ${{ secrets.E2E_BAND_API_KEY_USER }}
          BAND_REST_URL: ${{ secrets.E2E_BAND_REST_URL }}
          BAND_WS_URL: ${{ secrets.E2E_BAND_WS_URL }}
          GOOGLE_API_KEY: ${{ secrets.E2E_GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.E2E_OPENAI_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.E2E_CURSOR_API_KEY }}
          COPILOT_PROVIDER_TYPE: anthropic
          COPILOT_PROVIDER_BASE_URL: https://api.anthropic.com
          COPILOT_PROVIDER_API_KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY }}
          # Haiku sometimes answers an MCP tool request with text claiming success instead of
          # calling the tool (1 in 11 in run 36973721501), which fails the cells for the model's sake.
          COPILOT_MODEL: claude-sonnet-5-5
        run: |
          # FILTER carries vitest arguments, so it is word-split on purpose.
          # shellcheck disable=SC2086
          pnpm run test:baseline-live $FILTER

      - name: Upload the scorecard
        if: ${{ !cancelled() && hashFiles('scorecard/scorecard.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-scorecard
          path: scorecard/

      # OMP logs its turns (provider errors included) to its own files, never to the test output.
      - name: Upload OMP logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-logs
          path: ~/.omp/logs/
          if-no-files-found: ignore

      # The teardown below removes the Letta container, and its log with it.
      - name: Save the Letta server log
        if: ${{ failure() }}
        run: .github/scripts/setup-letta.sh logs

      - name: Upload the server logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-logs
          path: |
            ${{ runner.temp }}/letta/server.log
            ${{ runner.temp }}/parlant/server.log
          if-no-files-found: ignore

      - name: Stop the Letta and Parlant servers
        if: ${{ always() }}
        run: |
          .github/scripts/setup-letta.sh stop
          .github/scripts/setup-parlant.sh stop

      - name: Scorecard to the job summary
        if: ${{ !cancelled() && hashFiles('scorecard/scorecard.md') != '' }}
        run: cat "$SCORECARD_MD" >> "$GITHUB_STEP_SUMMARY"

  # Reports every finished run, red or green, as a comment that @mentions its
  # audience; GitHub emails each one. The nightly cc's the integrations roster,
  # a manual run only its dispatcher. A separate job so the write permissions
  # never reach the job that runs third-party CLIs with live secrets.
  report:
    name: report baseline
    needs: baseline
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit comments 403 under `read` (github/docs#12723)
      pull-requests: write # the sticky scorecard comment on a manual run's PR
    env:
      GH_TOKEN: ${{ github.token }}
      SCORECARD_MD: scorecard/scorecard.md
      PASSED: ${{ needs.baseline.result == 'success' }}
      FILTER: ${{ inputs.filter }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Absent when the baseline died before the scorecard; the report says so.
      - name: Download the scorecard
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: baseline-scorecard
          path: scorecard

      - name: Read integrations mentions list
        id: mentions
        if: ${{ github.event_name == 'schedule' }}
        run: bash .github/scripts/read-integrations-mentions.sh

      - name: Post the baseline report
        env:
          RECIPIENTS: ${{ github.event_name == 'schedule' && steps.mentions.outputs.mentions || format('@{0}', github.triggering_actor) }}
        run: node .github/scripts/post-baseline-scorecard.mjs
