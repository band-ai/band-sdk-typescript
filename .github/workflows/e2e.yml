name: E2E (live)

# Live E2E against the real Band platform. Provisions real agents, hits
# live REST/WS — nightly/on-demand only, never per-PR.
#
# Single lane (core) today; see packages/sdk/tests/integration/lanes.ts.

on:
  schedule:
    # Off-peak minute avoids GitHub's top-of-hour thundering herd.
    - cron: "23 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-live-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (core)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BAND_E2E_LANE: core
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # agent_config.yaml is gitignored; reconstitute from a repo secret.
      - name: Materialize agent_config.yaml
        working-directory: packages/sdk
        run: |
          cat > agent_config.yaml <<'EOF'
          ${{ secrets.SDK_E2E_AGENT_CONFIG_YAML }}
          EOF

      - name: Run core retry/participant live test
        working-directory: packages/sdk
        run: npx tsx tests/integration/core-retry-participant-live.ts
